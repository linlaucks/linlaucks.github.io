<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RSVP | Joyce Lin + Ayrton Laucks</title>
  <meta name="description" content="Wedding of Joyce Lin and Ayrton Laucks, 10 July 2027, Columbus Park Refectory, Chicago, IL.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f3e3d3">
  <link rel="icon" type="image/png" sizes="32x32" href="../../assets/img/icon-32.png">
  <link rel="apple-touch-icon" href="../../assets/img/icon-180.png">
  <link rel="preload" href="../../assets/fonts/cormorant-latin-500-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="../../assets/fonts/josefin-sans-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../../assets/css/style.css">
  <script src="../../assets/js/rsvp.js" defer></script>
</head>
<body class="has-pattern rsvp-page" data-root="../../">
  <header class="site-header">
    <div class="nav-band">
      <a class="nav-title" href="../../">JOYCE LIN<span class="plus">+</span>AYRTON LAUCKS</a>
      <nav class="nav-links" aria-label="Main"><a href="../../details/">Details</a><span class="sep" aria-hidden="true">-</span><a href="../../rsvp/" aria-current="page">RSVP</a><span class="sep" aria-hidden="true">-</span><a href="../../bridal-party/">Bridal Party</a><span class="sep" aria-hidden="true">-</span><a href="../../registry/">Registry</a></nav>
    </div>
  </header>
  <div class="page-bg">
  <main class="content" id="main">
    <h1 class="title">RSVP</h1>
    <form class="rsvp-form" data-step="dietary" novalidate>
      
      <fieldset class="field" data-field="dietary">
        <legend class="question">Do you have any food allergies / restrictions?</legend>
        <p class="help">We will do our best to accommodate all allergies and food restrictions. All food items will have a corresponding label for allergies and food restrictions.</p>
        <div class="check-grid"><label class="option"><input type="checkbox" name="dietary" value="Tree Nuts"><span>TREE NUTS</span></label><label class="option"><input type="checkbox" name="dietary" value="Soy"><span>SOY</span></label><label class="option"><input type="checkbox" name="dietary" value="Peanuts"><span>PEANUTS</span></label><label class="option"><input type="checkbox" name="dietary" value="Shellfish"><span>SHELLFISH</span></label><label class="option"><input type="checkbox" name="dietary" value="Dairy"><span>DAIRY</span></label><label class="option"><input type="checkbox" name="dietary" value="Fish"><span>FISH</span></label><label class="option"><input type="checkbox" name="dietary" value="Eggs"><span>EGGS</span></label><label class="option"><input type="checkbox" name="dietary" value="Sesame"><span>SESAME</span></label></div>
        <div class="check-grid"><label class="option"><input type="checkbox" name="dietary" value="Gluten-Free"><span>GLUTEN-FREE</span></label><label class="option"><input type="checkbox" name="dietary" value="Kosher"><span>KOSHER</span></label><label class="option"><input type="checkbox" name="dietary" value="Vegetarian"><span>VEGETARIAN</span></label><label class="option"><input type="checkbox" name="dietary" value="Halal"><span>HALAL</span></label><label class="option"><input type="checkbox" name="dietary" value="Vegan"><span>VEGAN</span></label><label class="option"><input type="checkbox" name="dietary" value="Pescatarian"><span>PESCATARIAN</span></label></div>
        <div class="other-row">
          <label class="option"><input type="checkbox" name="dietary" value="Other" id="dietary-other-check"><span>OTHER:</span></label>
          <input class="input" type="text" name="dietaryOther" aria-label="Other allergy or restriction">
        </div>
        <div class="none-row">
          <label class="option"><input type="checkbox" class="round" name="dietary" value="None" id="dietary-none"><span>NONE</span></label>
        </div>
      </fieldset>
      <div class="hp" aria-hidden="true"><label>Leave this empty <input type="text" name="website" tabindex="-1" autocomplete="off"></label></div>
      <div class="form-actions">
        <div class="btn-row"><button type="button" class="btn" data-action="back">Back</button><button type="submit" class="btn" data-action="next">Next</button></div>
        <p class="error form-status" role="alert"></p>
      </div>
    </form>
  </main>
  </div>
</body>
</html>
